# FixMessy on Render — created when Yemi approves the deploy tier.
# Intended: free web service (DynaSleepy) sharing REMU's paid Postgres via its
# Internal Database URL. Do NOT apply without his explicit go-ahead.
services:
  - type: web
    name: fixmessy
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: DATABASE_URL
        sync: false # paste REMU's Internal Database URL on Render dashboard
      - key: OPENAI_API_KEY
        sync: false
      - key: APP_URL
        value: https://fixmessy.onrender.com
